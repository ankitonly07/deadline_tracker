<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadline Tracker – Homework &amp; Lab Assignments</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>📚 Deadline Tracker</h1>
      <p class="sub">Daily Homework &amp; Lab Assignment Submission System · Section K3P26BT</p>
    </div>
    <button id="theme" aria-label="Toggle theme">🌓</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Total</span></div>
    <div class="stat"><b id="sPend" class="warn">0</b><span>Pending</span></div>
    <div class="stat"><b id="sLate" class="bad">0</b><span>Overdue</span></div>
    <div class="stat"><b id="sDone" class="ok">0</b><span>Done</span></div>
  </div>

  <div class="card" style="margin-top:14px">
    <form id="f">
      <input class="full" id="title" placeholder="Assignment title (e.g. Lab 3 – Loops in C)" required maxlength="80">
      <input id="subject" placeholder="Subject" required maxlength="40">
      <select id="type"><option value="homework">Homework</option><option value="lab">Lab assignment</option></select>
      <input id="due" type="datetime-local" required class="full">
      <button class="full" type="submit">+ Add assignment</button>
    </form>
  </div>

  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="pending">Pending</button>
    <button data-f="overdue">Overdue</button>
    <button data-f="homework">Homework</button>
    <button data-f="lab">Lab</button>
    <button data-f="done">Done</button>
  </div>

  <div id="list"></div>

  <footer class="card">
    <b>Team – Section K3P26BT</b>
    <table>
      <tr><th>Name</th><th>Reg. No.</th></tr>
      <tr><td>Ankit Kumar</td><td>12623138</td></tr>
      <tr><td>Prateek Priyadarshi</td><td>12623372</td></tr>
      <tr><td>Sachin R B</td><td>12622139</td></tr>
    </table>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
